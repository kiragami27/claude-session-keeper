# Claude Session Keeper — configuration
# Copy to ~/.claude-session-keeper/config.yml

# How long Claude's usage window lasts (do not change unless Anthropic changes this)
sessionDuration: 5h

# Minimum gap between messages to consider it a "new session"
# If you're actively using Claude, a short pause won't reset the timer
inactivityThreshold: 30m

# How early before the reset to send the ping (buffer for CLI startup time)
pingBuffer: 30s

# The claude CLI command name (change if installed elsewhere)
claudeCommand: claude

# The prompt sent to start the new session (minimal, low token cost)
pingPrompt: "hi"

# Optional: POST a JSON payload here after each ping (Slack/Discord/custom webhook)
# webhookUrl: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
