name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node --check bin/claude-session-keeper.js bin/csk-mcp.js
      - run: node --check src/keeper.js src/watcher.js src/scheduler.js src/config.js src/mcp-server.js
